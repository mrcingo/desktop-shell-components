# Settings for desktop-shell-notification-daemon.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload

[sound]
# When a notification plays a sound:
#   unless-suppressed  always, except when the application plays its own
#                      (it sets suppress-sound, as Slack does), so you never
#                      hear two sounds
#   always             also then
#   never
# A sound the application names itself always wins over the chime.
# play-sound = unless-suppressed

# 0 to 100
# volume = 70

# Milliseconds; notifications arriving faster than this make one sound
# minimum-interval = 1500

# The player; {volume} becomes 0.00 to 1.00 and the sound file is added last
# player = pw-play --volume={volume}

# The chimes, for normal and for critical notifications
# file = /usr/share/desktop-shell-components/notification-chime.wav
# critical-file = /usr/share/desktop-shell-components/notification-critical-chime.wav

[timeouts]
# Seconds after which a notification counts as expired for its sender, unless
# the sender chose; 0 for never. It stays unread in the status bar either way.
# low = 5
# normal = 10
# critical = 0

[history]
# Notifications kept; applies on restart
# size = 100

[do-not-disturb]
# Start with do-not-disturb on
# on-at-start = false

# Let critical notifications still make a sound
# critical-sounds = true

# Per application, by name or desktop entry, in any case. For example:
#
# [app:Spotify]
# ignore = true
#
# [app:Thunderbird]
# play-sound = always
# urgency = critical
# timeout = 30
