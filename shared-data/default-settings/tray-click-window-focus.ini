# Settings for desktop-shell-tray-click-window-focus.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload

[focus]
# false leaves tray clicks to the applications (sway then only marks them red)
# enabled = true

# Milliseconds after the click to focus once more, for applications that
# open their window only then; 0 for no second attempt
# second-attempt = 400
