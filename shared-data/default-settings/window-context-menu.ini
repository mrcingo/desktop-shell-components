# Settings for desktop-shell-window-context-menu.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload

[menu]
# false stops right-clicks on title bars from opening the menu
# enabled = true

[appearance]
# Use the colors and font of your sway bar; false uses your GTK theme
# follow-sway-bar = true

[screenshot]
# Screenshot in the menu (and Alt+Print Screen with the binding from the
# README): copy the picture to the clipboard, save it as a PNG, or both
# copy = true
# save = true

# Where to save, inside your home folder ("~/Shots" or "Shots"); empty means
# the Screenshots folder in your Pictures folder
# folder =
