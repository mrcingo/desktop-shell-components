# Settings for desktop-shell-window-snap: title bars that work as on
# Windows. Click a title bar to focus the window, double click it to
# maximize or restore, drag it to snap the window where the preview shows.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload
#
# Keyboard snapping as on Windows (Super+Left then Super+Up gives the top
# left quarter, Super+Up maximizes, Super+Down restores) needs these lines
# in your sway configuration; they are not added for you, because Super and
# the arrow keys often move focus already:
#   bindsym Mod4+Left  nop desktop-shell-window-snap left
#   bindsym Mod4+Right nop desktop-shell-window-snap right
#   bindsym Mod4+Up    nop desktop-shell-window-snap up
#   bindsym Mod4+Down  nop desktop-shell-window-snap down
# The words left-half, right-half, maximize and restore jump straight there.

[snap]
# false gives title bars back to sway's own clicking and dragging
# enabled = true

# How close to a screen edge, in pixels, the pointer snaps a window
# edge-zone-size = 24

# How far, in pixels, the pointer moves before a press becomes a drag
# drag-threshold = 8

# Borders of windows that end up floating, and of windows back in the tiling
# floating-border-width = 6
# tiled-border-width = 2

[preview]
# How strongly the place a window will land is filled, in percent
# opacity = 30

# Name the place, such as "Left half" or "Tab with Zed"
# show-labels = true

[appearance]
# Use the colors and font of your sway bar; false uses your GTK theme
# follow-sway-bar = true
