# Settings for desktop-shell-window-switcher.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload
#
# The keys are set in /etc/sway/config.d/60-desktop-shell-window-switcher.conf.

[switcher]
# workspace (the focused one) or all
# windows = workspace

# recent (last used first) or layout (as arranged on screen)
# order = recent

# Show a live preview of each window
# previews = true

# Largest preview width in pixels, 64 to 640
# preview-width = 240

# What each window shows: {name} {pid} {title} {workspace}
# label = {name} {pid}

[appearance]
# Use the colors and font of your sway bar; false uses your GTK theme
# follow-sway-bar = true
