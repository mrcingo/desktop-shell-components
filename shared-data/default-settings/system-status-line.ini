# Settings for desktop-shell-system-status-line.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload
#
# Formats: {placeholders} are replaced by values; anything else is shown as
# written and may use Pango markup, such as <b>bold</b> or
# <span foreground="#88cc88">green</span>.
#
# Mouse actions (left-click, middle-click, right-click, scroll-up,
# scroll-down): a built-in action, a command to run (no shell), or nothing.
# Built-in actions: toggle-mute volume-up volume-down brightness-up
# brightness-down next-power-profile toggle-bluetooth toggle-format
#
# Thresholds: past "warning" a block takes the warning color, past "urgent"
# the bar's urgent colors; -1 turns one off. An empty format hides a block
# in that state.

[status]
# Which blocks to show, left to right; leave one out to hide it
# order = attention network traffic bluetooth processor temperature memory disk volume brightness power-profile battery keyboard-layout clock notifications
# text-color = #bbbbbb
# warning-color = #e0b040
# A new notification's background and text for its first seconds
# accent-color = #005577
# accent-text-color = #eeeeee
# Unread notifications afterwards, normal and critical
# unread-color = #5fafd7
# critical-color = #ff5f5f
# Markers that only hold a place, such as "0" notifications
# quiet-color = #808080
# separator-width = 15
# Keep numbers at a fixed width so blocks do not move as values change
# pad-numbers = true

[attention]
# Windows asking for attention, in the urgent colors; {count}
# format = ATTN {count}
# format-none =
# left-click = focus-urgent-window

[network]
# Placeholders: {name} {signal} {interface} {vpn} (" VPN" while a VPN is up)
# format-wifi = WIFI {name} {signal}%{vpn}
# format-ethernet = ETH {name}{vpn}
# format-other = NET {name}{vpn}
# format-disconnected = NET offline
# Connected, but the internet cannot be reached (urgent)
# format-no-internet = NET {name} no internet
# Behind a login page, as in hotels (warning)
# format-portal = NET {name} login needed
# left-click = nm-connection-editor

[traffic]
# Bytes per second through the main connection: {down} {up}
# format = RX {down} TX {up}
# interval = 2

[bluetooth]
# format-off = BT off
# format-on = BT on
# format-connected = BT {connected}
# left-click = toggle-bluetooth

[processor]
# {usage} in percent
# format = CPU {usage}%
# warning = 80
# urgent = 95
# interval = 2

[temperature]
# {celsius} of the sensor below (a hwmon driver name; k10temp on AMD, coretemp on Intel)
# format = TEMP {celsius}C
# sensor = k10temp
# warning = 80
# urgent = 90
# interval = 5

[memory]
# {used} {total} {available} {percent} {swap_used}; thresholds use the used percent
# format = MEM {used}/{total}
# warning = 80
# urgent = 95
# interval = 5

[disk]
# {free} {used} {total} {free_percent}; thresholds use the free percent
# format = DISK {free}
# path = /
# warning = 15
# urgent = 5
# interval = 30

[volume]
# {volume} in percent
# format = VOL {volume}%
# format-muted = VOL muted
# step = 5
# left-click = toggle-mute
# right-click = pavucontrol
# scroll-up = volume-up
# scroll-down = volume-down

[brightness]
# {percent}; scrolling changes it when the backlight is writable without root
# format = BRI {percent}%
# step = 5
# scroll-up = brightness-up
# scroll-down = brightness-down
# interval = 2

[power-profile]
# {profile}: power-saver, balanced or performance
# format = PWR {profile}
# left-click = next-power-profile

[battery]
# {percent} {time} (to empty while discharging, to full while charging)
# format-discharging = BAT {percent}% {time}
# format-charging = BAT {percent}% CHR {time}
# format-full = BAT full
# format-other = BAT {percent}%
# warning = 20
# urgent = 10

[keyboard-layout]
# {layout}, such as es
# format = {layout}

[clock]
# strftime-style formats; a left click switches between the two
# format = %a %d %b %H:%M
# format-alt = %Y-%m-%d %H:%M:%S
# left-click = toggle-format

[notifications]
# The latest notification, shown in the bar itself (no popups):
# {text} cut to "width" characters with "...", {count} unread,
# {more} (" (+2)" when two more are unread), {dnd} (" DND" while on)
# format-unread = {text}{more}{dnd}
# Nothing unread: a quiet marker keeps the place of the block
# format-read = 0
# show-when-empty = true
# format-do-not-disturb = DND
# No notification daemon running
# format-unavailable = NOTIF off
# width = 50
# A new notification gets the accent background for these seconds; 0 for never
# new-notification-emphasis-seconds = 4
# left-click = activate-notification
# middle-click = mark-notifications-read
# right-click = toggle-do-not-disturb
