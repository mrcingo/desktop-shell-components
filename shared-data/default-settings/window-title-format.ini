# Settings for desktop-shell-window-title-format.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload

[titles]
# false restores the plain titles and stops the program
# enabled = true

# The title bar text: {title} {pid} {name} {workspace}, plus sway's own
# placeholders (%title %app_id %class %instance %shell), which are never
# shortened. Use " or ' but not both. Markup needs "font pango:..." in the
# sway configuration; without it use:
#   format = {title} ({pid})
# format = {title} <span alpha='60%'>({pid})</span>

# At most this many characters of {title}, ending in "..."; 0 for no limit
# title-length = 60

# Also shorten {title} so the whole text fits the title bar, keeping the
# process ID in view
# fit-title-bar = true
