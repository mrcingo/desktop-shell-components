# Settings for desktop-shell-application-style-export.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload

[export]
# false stops writing other programs' style files; the ones written stay
# enabled = true

# Which programs get the shared look
# gtk3 = true
# gtk4 = true
# gtk-settings = true
# gsettings = true
# lock-screen = true
# prompts = true
# Single-color icons recolored to the text color (see [icons])
# recolor-icons = true

# auto (dark when the background is dark), dark or light
# color-scheme = auto

[icons]
# Single-color icons copied, in the text color, to
# ~/.local/share/icons/Adwaita/symbolic, where they replace Adwaita's dark
# gray ones for you only. Programs such as Thunar show these as they are,
# so on a dark background they would be nearly invisible. Full-color icons,
# such as the folders in a file list, are never changed. Names are
# separated by ";" and have no "-symbolic" ending.
# recolored-icons = go-home;user-home;user-desktop;user-bookmarks;user-trash;user-trash-full;document-open-recent;starred;folder;folder-documents;folder-download;folder-music;folder-pictures;folder-videos;folder-publicshare;folder-templates;folder-remote;folder-saved-search;network-server;network-workgroup;computer;drive-harddisk;drive-removable-media;drive-optical;media-removable;media-optical;media-flash
