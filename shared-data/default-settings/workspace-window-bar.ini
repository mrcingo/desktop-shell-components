# Settings for desktop-shell-workspace-window-bar.
#
# Copy this file to ~/.config/desktop-shell-components/ and uncomment what
# you want to change. Every line shows the default. Apply with:
#   swaymsg reload

[bar]
# bottom or top
# position = bottom

# auto (as tall as sway's top bar) or a height in pixels, 10 to 200
# height = auto

# What each window shows: {name} {pid} {title} {workspace}
# label = {name} {pid}

# What a click does: focus, close or nothing
# left-click = focus
# middle-click = close
# right-click = nothing

[appearance]
# Use the colors and font of your sway bar; false uses your GTK theme
# follow-sway-bar = true
